[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "html-css-to-image"
version = "0.2.0"
description = "Official Python client for the HTML/CSS to Image API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "HTML/CSS to Image API", email = "support@htmlcsstoimage.com" },
]
keywords = ["html-to-image", "screenshot", "hcti", "htmlcsstoimage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.16",
  "ruff>=0.12",
]

[project.urls]
Homepage = "https://htmlcsstoimage.com"
Documentation = "https://docs.htmlcsstoimage.com"
Repository = "https://github.com/htmlcsstoimage/python-client"
Issues = "https://github.com/htmlcsstoimage/python-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/html_css_to_image"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
