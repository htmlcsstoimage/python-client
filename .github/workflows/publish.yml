# After CI succeeds for a push to main, publishes the declared package version
# when it does not yet exist on PyPI. A successful publication creates the
# matching GitHub Release and attaches the wheel and source distribution.
#
# PyPI Trusted Publishing is configured for:
#   Owner:       htmlcsstoimage
#   Repository:  python-client
#   Workflow:    publish.yml
#   Environment: blank
#
# No PyPI token or GitHub Actions secret is required.

name: Publish to PyPI

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    name: Check package version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      package_name: ${{ steps.version.outputs.package_name }}
      package_version: ${{ steps.version.outputs.package_version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check PyPI for the declared version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v${package_version}"

          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          status_code="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "https://pypi.org/pypi/${package_name}/${package_version}/json")"
          case "$status_code" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "${package_name} ${package_version} already exists on PyPI."
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "${package_name} ${package_version} is new and will be published."
              ;;
            *)
              echo "PyPI returned unexpected HTTP status ${status_code}." >&2
              exit 1
              ;;
          esac

  build:
    name: Build distributions
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - run: python -m pip install --upgrade pip build
      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ needs.version.outputs.package_version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-${{ needs.version.outputs.package_version }}
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs: [version, build, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-${{ needs.version.outputs.package_version }}
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
